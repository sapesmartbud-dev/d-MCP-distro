<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <!-- UK Flag (Union Jack) -->
  <!-- Background blue -->
  <rect x="1" y="1" width="22" height="22" fill="#012169" stroke="#000000" stroke-width="0.5"/>

  <!-- White cross -->
  <rect x="1" y="9" width="22" height="6" fill="#FFFFFF"/>
  <rect x="9" y="1" width="6" height="22" fill="#FFFFFF"/>

  <!-- Red cross -->
  <rect x="1" y="10" width="22" height="4" fill="#C8102E"/>
  <rect x="10" y="1" width="4" height="22" fill="#C8102E"/>

  <!-- Diagonal white -->
  <polygon points="1,1 10,10 1,19" fill="#FFFFFF"/>
  <polygon points="23,1 14,10 23,19" fill="#FFFFFF"/>
  <polygon points="1,23 10,14 1,5" fill="#FFFFFF"/>
  <polygon points="23,23 14,14 23,5" fill="#FFFFFF"/>

  <!-- Diagonal red -->
  <polygon points="2,1 9,8 2,13" fill="#C8102E"/>
  <polygon points="22,1 15,8 22,13" fill="#C8102E"/>
  <polygon points="2,23 9,16 2,11" fill="#C8102E"/>
  <polygon points="22,23 15,16 22,11" fill="#C8102E"/>
</svg>
